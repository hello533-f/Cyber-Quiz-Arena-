<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuiz 3D Arena</title>
    
    <!-- 3rd Ad Script (Social Bar / Native) -->
    <script async="async" data-cfasync="false" src="https://bauval.org/21/9cf0aa6ed8e312ad21735b574d3d5d8d"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Ad Banners */
        .ad-banner {
            margin: 10px 0;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .cat-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 22px 15px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .cat-card:hover {
            border-color: #38bdf8;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.2);
        }
        .cat-card h3 {
            font-size: 15px;
            color: #f1f5f9;
            margin-top: 10px;
            font-weight: 600;
        }
        .cat-icon {
            font-size: 36px;
        }

        /* Quiz Screen */
        .quiz-screen, .result-screen {
            display: none;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(16px);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: #38bdf8;
            font-size: 14px;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f8fafc;
            min-height: 60px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: rgba(31, 41, 55, 0.9);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
            text-align: left;
        }
        .option-btn:hover {
            background: rgba(55, 65, 81, 1);
            border-color: #38bdf8;
        }
        .option-btn.correct {
            background: #10b981 !important;
            border-color: #059669;
        }
        .option-btn.wrong {
            background: #ef4444 !important;
            border-color: #dc2626;
        }
        .back-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 CYBER QUIZ ARENA ⚡</h1>

    <!-- 1st Ad Script (Banner 320x50) -->
    <div class="ad-banner">
        <script data-cfasync="false" src="https://bauval.org/14/685028b51716ca3a8f56482ff0a1a547"></script>
    </div>

    <!-- CATEGORY SELECTION SCREEN -->
    <div id="homeScreen" class="category-grid">
        <div class="cat-card" onclick="startQuiz('coding')">
            <div class="cat-icon">💻</div>
            <h3>Coding & Web</h3>
        </div>
        <div class="cat-card" onclick="startQuiz('anime')">
            <div class="cat-icon">🍥</div>
            <h3>Anime & Movies</h3>
        </div>
        <div class="cat-card" onclick="startQuiz('hacking')">
            <div class="cat-icon">🛡️</div>
            <h3>Cybersecurity</h3>
        </div>
        <div class="cat-card" onclick="startQuiz('gk')">
            <div class="cat-icon">🌍</div>
            <h3>General Trivia</h3>
        </div>
    </div>

    <!-- ACTIVE QUIZ SCREEN -->
    <div id="quizScreen" class="quiz-screen">
        <div class="quiz-header">
            <button class="back-btn" onclick="goHome()">⬅ Exit</button>
            <span>Q: <span id="currentQNum">1</span>/5</span>
            <span>Score: <span id="liveScore">0</span></span>
        </div>
        <div class="question-box" id="questionText">Question goes here?</div>
        <div class="options-list" id="optionsContainer">
            <!-- Options dynamically injected -->
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="result-screen">
        <h2 style="color: #38bdf8; margin-bottom: 10px;">Quiz Completed! 🎉</h2>
        <p style="font-size: 18px; margin-bottom: 20px;">Your Final Score: <span id="finalScore" style="font-weight: bold; color: #10b981;">0</span> / 5</p>
        <button class="action-btn" onclick="goHome()">Play Again 🚀</button>
    </div>

    <!-- 5th Ad Script (320x50 Banner with atOptions) -->
    <div class="ad-banner" style="margin-top: 15px;">
        <script>
          atOptions = {
            'key' : 'aa557e2d177f650ac58c4429ad87f71c',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/aa557e2d177f650ac58c4429ad87f71c"></script>
    </div>

    <!-- 3rd Ad Container Div -->
    <div id="container-9cf0aa6ed8e312ad21735b574d3d5d8d"></div>
</div>

<script>
    const quizData = {
        coding: [
            { q: "What does HTML stand for?", options: ["Hyper Text Markup Language", "High Tech Modern Language", "Hyperlink and Text Markup Language", "Home Tool Markup Language"], correct: 0 },
            { q: "Which language is used for styling web pages?", options: ["Python", "HTML", "CSS", "SQL"], correct: 2 },
            { q: "Inside which HTML element do we put the JavaScript?", options: ["<js>", "<script>", "<javascript>", "<code"], correct: 1 },
            { q: "Which property is used to change background color in CSS?", options: ["color", "bg-color", "background-color", "background"], correct: 2 },
            { q: "What year was JavaScript launched?", options: ["1995", "1990", "2000", "1985"], correct: 0 }
        ],
        anime: [
            { q: "In Death Note, what is L's real name?", options: ["Light", "Lawliet", "Ryuzaki", "Soichiro"], correct: 1 },
            { q: "What breathing style does Tanjiro primarily use initially?", options: ["Flame Breathing", "Water Breathing", "Thunder Breathing", "Beast Breathing"], correct: 1 },
            { q: "Which anime features the 'Survey Corps'?", options: ["Naruto", "Bleach", "Attack on Titan", "One Piece"], correct: 2 },
            { q: "What is the name of Goku's signature attack?", options: ["Rasengan", "Kamehameha", "Chidori", "Bankai"], correct: 1 },
            { q: "In which anime do students attend U.A. High School?", options: ["Jujutsu Kaisen", "My Hero Academia", "Tokyo Ghoul", "Black Clover"], correct: 1 }
        ],
        hacking: [
            { q: "What does OSINT stand for in cybersecurity?", options: ["Open Source Intelligence", "Operating System Internal Network Tool", "Online Security Intelligence", "Offensive Security Integration"], correct: 0 },
            { q: "Which tool is commonly used for network port scanning?", options: ["Photoshop", "Nmap", "Notepad++", "VLC"], correct: 1 },
            { q: "What type of attack involves overwhelming a server with traffic?", options: ["Phishing", "DDoS", "SQL Injection", "Man-in-the-Middle"], correct: 1 },
            { q: "What port does standard HTTP use?", options: ["21", "443", "80", "22"], correct: 2 },
            { q: "What is a malicious software designed to block access to data until a fee is paid?", options: ["Spyware", "Adware", "Ransomware", "Trojan"], correct: 2 }
        ],
        gk: [
            { q: "What is the capital of Pakistan?", options: ["Lahore", "Karachi", "Islamabad", "Peshawar"], correct: 2 },
            { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
            { q: "How many continents are there on Earth?", options: ["5", "6", "7", "8"], correct: 2 },
            { q: "What is the largest ocean on Earth?", options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"], correct: 3 },
            { q: "Which element has the chemical symbol 'O'?", options: ["Gold", "Oxygen", "Silver", "Iron"], correct: 1 }
        ]
    };

    let currentCategory = '';
    let questionIndex = 0;
    let score = 0;
    let currentQuestions = [];

    function startQuiz(category) {
        currentCategory = category;
        currentQuestions = quizData[category];
        questionIndex = 0;
        score = 0;
        
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        
        loadQuestion();
    }

    function loadQuestion() {
        if(questionIndex >= currentQuestions.length) {
            showResult();
            return;
        }
        
        let q = currentQuestions[questionIndex];
        document.getElementById('currentQNum').innerText = questionIndex + 1;
        document.getElementById('liveScore').innerText = score;
        document.getElementById('questionText').innerText = q.q;
        
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });
        document.getElementById('optionsContainer').innerHTML = optionsHtml;
    }

    function checkAnswer(selectedIdx) {
        let q = currentQuestions[questionIndex];
        let buttons = document.getElementsByClassName('option-btn');
        
        if(selectedIdx === q.correct) {
            buttons[selectedIdx].classList.add('correct');
            score += 1;
        } else {
            buttons[selectedIdx].classList.add('wrong');
            buttons[q.correct].classList.add('correct');
        }
        
        setTimeout(() => {
            questionIndex++;
            loadQuestion();
        }, 600);
    }

    function showResult() {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.getElementById('finalScore').innerText = score;
    }

    function goHome() {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('homeScreen').style.display = 'grid';
    }
</script>

</body>
</html>
